name: Deploy VisionCreator

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

    - name: Build application
      run: npm run build

    - name: Deploy to staging
      if: github.ref == 'refs/heads/staging'
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
      run: |
        echo "$DEPLOY_KEY" > deploy_key
        chmod 600 deploy_key
        scp -i deploy_key -r .next package.json package-lock.json server.js ecosystem.config.js ubuntu@$SERVER_IP:/path/to/visioncreator-staging
        ssh -i deploy_key ubuntu@$SERVER_IP 'cd /path/to/visioncreator-staging && npm ci --only=production && pm2 reload ecosystem.config.js --env staging'

    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        SERVER_IP: ${{ secrets.PRODUCTION_SERVER_IP }}
      run: |
        echo "$DEPLOY_KEY" > deploy_key
        chmod 600 deploy_key
        scp -i deploy_key -r .next package.json package-lock.json server.js ecosystem.config.js ubuntu@$SERVER_IP:/path/to/visioncreator
        ssh -i deploy_key ubuntu@$SERVER_IP 'cd /path/to/visioncreator && npm ci --only=production && pm2 reload ecosystem.config.js --env production'

    - name: Run post-deployment checks
      env:
        BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://visioncreator.com' || 'https://staging.visioncreator.com' }}
      run: |
        ./scripts/verify-deployment.sh

    - name: Notify team on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: Deployment failed! Check the logs for more details.
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

